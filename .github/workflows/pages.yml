# Publishes the game to GitHub Pages. It runs only when started by hand (Actions tab -> pages -> Run workflow),
# so nothing goes live until the owner decides. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: pages
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Name set to build with (original or loom)"
        default: original
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx vite build
        env:
          NAMES: ${{ inputs.names }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
